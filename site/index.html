<html lang="en">

<body>
<title>Ramyasri's Trading Course</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a trading-desk notebook. The six levels are drawn as an uptrend of candles
   (higher highs, higher lows); each candle fills green as lessons are done.
   Views: #map (home), #level-1..#level-6, #glossary. Single file, no build step,
   so it can move to a private repo as-is. */
:root {
  --bg: #f3f4ef;          /* cool paper */
  --surface: #ffffff;
  --sunken: #e8eae2;
  --ink: #17222b;         /* chart-ink navy */
  --muted: #5b6770;
  --line: #d3d7cd;
  --accent: #0e5a6b;      /* deep sea teal: links, focus */
  --accent-soft: #d6e8ea;
  --up: #1d7f55;          /* bullish candle */
  --up-soft: #d5eee1;
  --down: #b8423a;        /* bearish candle */
  --down-soft: #f5dcd8;
  --mark: #c98a0b;        /* marigold: "you are here" */
  --mark-soft: #f7e7c2;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10171c; --surface: #172128; --sunken: #0c1216; --ink: #e6ebe7; --muted: #9aa7ae;
    --line: #2b3841; --accent: #6fc3d2; --accent-soft: #163640; --up: #3fbf86; --up-soft: #15382a;
    --down: #ec7a70; --down-soft: #41201d; --mark: #f0b43c; --mark-soft: #3d2f12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10171c; --surface: #172128; --sunken: #0c1216; --ink: #e6ebe7; --muted: #9aa7ae;
  --line: #2b3841; --accent: #6fc3d2; --accent-soft: #163640; --up: #3fbf86; --up-soft: #15382a;
  --down: #ec7a70; --down-soft: #41201d; --mark: #f0b43c; --mark-soft: #3d2f12; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.6 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1040px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.15; margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 12px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* top bar */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
}
.top .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font: 700 18px/1 var(--f-display); color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 8px; }
.brand svg { flex: none; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
nav.tabs a {
  text-decoration: none; color: var(--muted); font-weight: 700; font-size: 14px;
  padding: 6px 12px; border-radius: 999px;
}
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }
nav.tabs a:hover:not([aria-current="page"]) { color: var(--ink); background: var(--sunken); }

main { padding-top: 28px; }
.view { display: grid; gap: 32px; }

/* summary */
.hello { display: grid; gap: 8px; }
.hello h1 { font-size: clamp(28px, 5vw, 42px); }
.hello p { margin: 0; color: var(--muted); max-width: 62ch; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.stat b { font: 600 22px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.stat.next b { font: 700 15px/1.35 var(--f-body); }
.stat.next a { text-decoration: none; }
@media (max-width: 720px) { .stats { grid-template-columns: 1fr 1fr; } .stat.next { grid-column: 1 / -1; } }

/* candle map */
.chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 18px 8px; display: grid; gap: 6px; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.chart-head h2 { font-size: 20px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.chart-scroll { overflow-x: auto; }
svg.candles { display: block; width: 100%; min-width: 520px; height: auto; }
svg.candles text { fill: var(--muted); font-family: var(--f-mono); }
svg.candles .lvl-label { fill: var(--ink); font-weight: 600; }
svg.candles a { cursor: pointer; }
svg.candles a:hover .body-outline, svg.candles a:focus .body-outline { stroke: var(--accent); stroke-width: 3; }

/* level cards */
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 860px) { .levels { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 540px) { .levels { grid-template-columns: 1fr; } }
.lvl {
  display: grid; gap: 8px; align-content: start; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px;
}
.lvl:hover { border-color: var(--accent); }
.lvl.current { border-color: var(--mark); box-shadow: 0 0 0 1px var(--mark); }
.lvl-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.lvl h3 { font-size: 18px; }
.lvl p { margin: 0; color: var(--muted); font-size: 14px; }
.lvl .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.bar { height: 6px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--up); border-radius: 99px; }

.chip { font: 600 11px/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; padding: 5px 8px; border-radius: 99px; white-space: nowrap; }
.chip.done { background: var(--up-soft); color: var(--up); }
.chip.now { background: var(--mark-soft); color: var(--mark); }
.chip.locked { background: var(--sunken); color: var(--muted); }
.chip.learn { background: var(--down-soft); color: var(--down); }

.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .rules { grid-template-columns: 1fr; } }
.rule { border-top: 3px solid var(--ink); padding-top: 10px; }
.rule b { font-family: var(--f-display); font-size: 17px; display: block; margin-bottom: 4px; }
.rule p { margin: 0; color: var(--muted); font-size: 14px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.section-title h2 { font-size: 22px; }

/* level detail */
.crumbs { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.crumbs a { text-decoration: none; font-weight: 700; }
.lvl-hero { display: grid; gap: 10px; }
.lvl-hero h1 { font-size: clamp(26px, 4.6vw, 38px); }
.lvl-hero p { margin: 0; max-width: 66ch; color: var(--muted); }
.lvl-hero .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.note { background: var(--mark-soft); color: var(--ink); border-radius: var(--r); padding: 12px 14px; font-size: 14px; max-width: 72ch; }
.note.warn { background: var(--down-soft); }
.cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }
.panel { display: grid; gap: 12px; }
.panel h2 { font-size: 20px; }

ol.lessons { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
ol.lessons li { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line); }
ol.lessons li:first-child { border-top: 0; }
ol.lessons li.is-done .ltitle { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
ol.lessons li.is-next { background: var(--mark-soft); }
.lnum { font: 600 13px/1 var(--f-mono); color: var(--muted); width: 3.2em; }
.ltitle { min-width: 0; }
.lopen { font-size: 13px; font-weight: 700; white-space: nowrap; }
.lopen.soon { color: var(--muted); font-weight: 400; font-style: italic; }
@media (max-width: 540px) {
  ol.lessons li { grid-template-columns: auto auto minmax(0, 1fr); }
  .lopen { grid-column: 3; }
}

.tick { appearance: none; -webkit-appearance: none; margin: 0; width: 22px; height: 22px; border: 2px solid var(--muted); border-radius: 6px; display: grid; place-items: center; cursor: pointer; background: var(--surface); }
.tick:checked { background: var(--up); border-color: var(--up); }
.tick:checked::after { content: ""; width: 6px; height: 11px; border: solid var(--surface); border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
.tick:disabled { opacity: .4; cursor: not-allowed; }

ul.goals { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ul.goals label { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; cursor: pointer; }
ul.goals .tick { margin-top: 1px; }
ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.box h3 { font-size: 16px; }
.box p { margin: 0; font-size: 15px; }
.terms { display: flex; flex-wrap: wrap; gap: 6px; }
.terms a { text-decoration: none; font-size: 13px; padding: 4px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.terms a:hover { text-decoration: underline; }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }
.pager a { text-decoration: none; font-weight: 700; }

/* glossary */
.gl-tools { display: grid; gap: 12px; }
.search { width: 100%; max-width: 520px; font: 16px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { font: 700 13px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--muted); padding: 5px 12px; border-radius: 99px; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.gl-count { color: var(--muted); font-size: 14px; }
dl.gloss { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; }
@media (max-width: 760px) { dl.gloss { grid-template-columns: 1fr; } }
.term { padding: 14px 0; border-top: 1px solid var(--line); min-width: 0; scroll-margin-top: 90px; }
.term.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--mark-soft); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .term.flash { animation: none; background: var(--mark-soft); } }
.term dt { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font: 700 17px/1.3 var(--f-display); }
.term dt small { font: 600 11px var(--f-mono); color: var(--muted); letter-spacing: .05em; }
.term dd { margin: 4px 0 0; color: var(--ink); font-size: 15px; }
.empty { color: var(--muted); padding: 24px 0; }

footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.save-state::before { content: "● "; color: var(--muted); }
.save-state.ok::before { color: var(--up); }
.save-state.local::before { color: var(--mark); }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; }
</style>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#map">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <line x1="5" y1="6" x2="5" y2="20" stroke="currentColor" stroke-width="1.5"/>
        <rect x="2.5" y="10" width="5" height="7" fill="var(--down)"/>
        <line x1="12" y1="3" x2="12" y2="16" stroke="currentColor" stroke-width="1.5"/>
        <rect x="9.5" y="5" width="5" height="8" fill="var(--up)"/>
        <line x1="19" y1="1" x2="19" y2="12" stroke="currentColor" stroke-width="1.5"/>
        <rect x="16.5" y="2" width="5" height="7" fill="var(--up)"/>
      </svg>
      Trading Course
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#map" data-tab="map">Level map</a>
      <a href="#level-1" data-tab="level">Lessons</a>
      <a href="#glossary" data-tab="glossary">Glossary</a>
    </nav>
  </div>
</header>

<main class="wrap" id="app" aria-live="polite"></main>

<div class="wrap">
  <footer>
    <span class="save-state" id="saveState">Loading your progress…</span>
    <span>Indian market (NSE/BSE). For learning, not investment advice. <button class="linkbtn" id="resetBtn" type="button">Reset progress</button></span>
  </footer>
</div>

<script>
/* ============================================================
   COURSE DATA. Lesson links: when a lesson page is published,
   put its URL in LESSON_URLS under the lesson's id ("1.01" etc).
   ============================================================ */
const LESSON_URLS = {
  "1.01": "https://claude.ai/artifact/8Uh3nFEL9U5KxdPmP7B7y4",

  "1.08": "https://claude.ai/artifact/2ZJ6gPs4xgfqKTDGaqs5xa",
  "1.09": "https://claude.ai/artifact/6i1pYV92SFK52BuE8zyT5G",
  "1.10": "https://claude.ai/artifact/926EKCSGGaWn7S6xG4GTBf",
};

const LEVELS = [
  {

  {

    lessons: [
      "Trading styles compared: scalping, intraday, swing, positional, and which fits a working person",

/* Glossary: term -> [level first taught, plain-English meaning] */

/* ============================================================
   PROGRESS STORE. Saves to the page's own database when this
   page runs on claude.ai (so it follows you across devices),
   and always keeps a copy in this browser as a backup.
   To port: replace dbLoad/dbSave with your own API calls.
   ============================================================ */
const LS_KEY = "trading-course-progress-v1";
let state = { lessons: {}, goals: {}, updatedAt: 0 };
let dbRef = null;

function lsLoad() { try { const s = JSON.parse(localStorage.getItem(LS_KEY) || "null"); return s && typeof s === "object" ? s : null; } catch (e) { return null; } }
function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }
function clean(s) { return { lessons: (s && s.lessons) || {}, goals: (s && s.goals) || {}, updatedAt: (s && s.updatedAt) || 0 }; }
function setSaveState(text, cls) { const el = document.getElementById("saveState"); el.textContent = text; el.className = "save-state " + (cls || ""); }

let saveTimer = null;
function persist() {
  state.updatedAt = Date.now();
  lsSave();
  if (!dbRef) { setSaveState("Saved in this browser only", "local"); return; }
  setSaveState("Saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await dbRef.set({ lessons: state.lessons, goals: state.goals, updatedAt: state.updatedAt }); setSaveState("Saved to your account", "ok"); }
    catch (e) { setSaveState("Couldn't save to your account. Kept in this browser.", "local"); }
  }, 500);
}

async function initStore() {
  const local = lsLoad();
  if (local) state = clean(local);
  render();
  setSaveState(local ? "Saved in this browser only" : "No progress yet", local ? "local" : "");
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) return;
  dbRef = db.doc("progress/state");
  try {
    const snap = await dbRef.get();
    const remote = snap.exists ? clean(snap.data()) : null;
    if (remote && remote.updatedAt >= state.updatedAt) { state = remote; lsSave(); render(); setSaveState("Saved to your account", "ok"); }
    else if (local) { persist(); }
    else setSaveState("Progress saves to your account", "ok");
  } catch (e) { dbRef = null; setSaveState("Saved in this browser only", "local"); }
}

/* ============================================================
   PROGRESS LOGIC
   ============================================================ */
const levelOf = n => LEVELS[n - 1];
const lessonsDone = L => L.ids.filter(id => state.lessons[id]).length;
const goalId = (n, i) => n + ".g" + (i + 1);
const goalsDone = L => L.goals.filter((_, i) => state.goals[goalId(L.n, i)]).length;
const levelComplete = L => goalsDone(L) === L.goals.length;
const levelUnlocked = n => n === 1 || levelComplete(levelOf(n - 1));
function lessonUnlocked(L, idx) {
  if (levelUnlocked(L.n)) return true;
  return !!(L.earlyLessons && idx < L.earlyLessons && levelUnlocked(4));
}
function currentLevel() { for (const L of LEVELS) if (!levelComplete(L)) return L.n; return 6; }
function levelPct(L) {
  const total = L.lessons.length + L.goals.length;
  return (lessonsDone(L) + goalsDone(L)) / total;
}
function nextLesson() {
  for (const L of LEVELS) for (let i = 0; i < L.ids.length; i++)
    if (!state.lessons[L.ids[i]] && lessonUnlocked(L, i)) return { L, i };
  return null;
}
function status(L) {
  if (levelComplete(L)) return ["done", "Passed"];
  if (L.n === currentLevel()) return ["now", "You are here"];
  if (!levelUnlocked(L.n)) return ["locked", "Locked"];
  return ["now", "Open"];
}

const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const slug = s => "t-" + s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
let glFilter = 0, glQuery = "", pendingTerm = null;

function candlesSVG() {
  const cur = currentLevel();
  const W = 640, H = 360, x0 = 70, step = 98, bw = 40, bodyH = 92, rise = 30, base = 290;
  let g = "";
  // faint grid
  for (let y = 60; y <= 310; y += 50) g += `<line x1="40" y1="${y}" x2="${W - 10}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
  // trendline through the lows (higher lows)
  const lowY = i => base - i * rise + 16;
  g += `<line x1="${x0 - 20}" y1="${lowY(0) + 6}" x2="${x0 + 5 * step + 30}" y2="${lowY(5) - 2}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 5"/>`;
  g += `<text x="${x0 + 3.2 * step}" y="${lowY(3.2) + 26}" font-size="12">uptrend: higher highs, higher lows</text>`;
  LEVELS.forEach((L, i) => {
    const cx = x0 + i * step, bot = base - i * rise, top = bot - bodyH;
    const pct = levelPct(L), fillH = Math.round(bodyH * pct);
    const isCur = L.n === cur, locked = !levelUnlocked(L.n) && !(L.earlyLessons && levelUnlocked(4));
    const stroke = isCur ? "var(--mark)" : "var(--ink)";
    g += `<a href="#level-${L.n}" aria-label="Level ${L.n}, ${esc(L.title)}, ${Math.round(pct * 100)}% done">`;
    g += `<line x1="${cx}" y1="${top - 18}" x2="${cx}" y2="${bot + 16}" stroke="${stroke}" stroke-width="2"/>`;
    g += `<rect x="${cx - bw / 2}" y="${top}" width="${bw}" height="${bodyH}" fill="var(--surface)"/>`;
    if (fillH > 0) g += `<rect x="${cx - bw / 2}" y="${bot - fillH}" width="${bw}" height="${fillH}" fill="var(--up)"/>`;
    g += `<rect class="body-outline" x="${cx - bw / 2}" y="${top}" width="${bw}" height="${bodyH}" fill="none" stroke="${stroke}" stroke-width="${isCur ? 3 : 2}" ${locked ? 'stroke-dasharray="4 3"' : ""}/>`;
    g += `<text class="lvl-label" x="${cx}" y="${H - 22}" text-anchor="middle" font-size="15">L${L.n}</text>`;
    g += `<text x="${cx}" y="${H - 6}" text-anchor="middle" font-size="11">${esc(L.short)}</text>`;
    g += `<text x="${cx}" y="${top - 26}" text-anchor="middle" font-size="12">${Math.round(pct * 100)}%</text>`;
    if (isCur) g += `<polygon points="${cx - 7},${top - 48} ${cx + 7},${top - 48} ${cx},${top - 38}" fill="var(--mark)"/>`;
    g += `</a>`;
  });
  return `<svg class="candles" viewBox="0 0 ${W} ${H}" role="img" aria-label="Level map drawn as six rising candles">${g}</svg>`;
}

function renderMap() {
  const totalL = LEVELS.reduce((a, L) => a + L.lessons.length, 0);
  const doneL = LEVELS.reduce((a, L) => a + lessonsDone(L), 0);
  const passed = LEVELS.filter(levelComplete).length;
  const nx = nextLesson();
  const nxHtml = nx
    ? `<b><a href="#level-${nx.L.n}">${esc(nx.L.ids[nx.i])} · ${esc(nx.L.lessons[nx.i])}</a></b><span>Next lesson</span>`
    : `<b>All lessons done</b><span>Next lesson</span>`;
  app.innerHTML = `
  <section class="view">
    <div class="hello">
      <span class="eyebrow">NSE · BSE · ₹ · swing first</span>
      <h1>From your first share to your own trading system</h1>
      <p>Six levels in order. Each one unlocks when you tick off the previous level's goals. About an hour a day, 9 to 12 months, then at least 3 months of paper trading before any real money.</p>
    </div>
    <div class="stats">
      <div class="stat"><b>${doneL}<span class="mono" style="font-size:15px;color:var(--muted)"> / ${totalL}</span></b><span>Lessons done</span></div>
      <div class="stat"><b>${passed}<span class="mono" style="font-size:15px;color:var(--muted)"> / 6</span></b><span>Levels passed</span></div>
      <div class="stat"><b>L${currentLevel()}</b><span>${esc(levelOf(currentLevel()).title)}</span></div>
      <div class="stat next">${nxHtml}</div>
    </div>
    <div class="chart-card">
      <div class="chart-head">
        <h2>Level map</h2>
        <div class="legend"><span><i style="background:var(--up)"></i>Done</span><span><i style="background:var(--mark)"></i>You are here</span><span><i style="border:1.5px dashed var(--ink)"></i>Locked</span></div>
      </div>
      <div class="chart-scroll">${candlesSVG()}</div>
    </div>
    <div>
      <div class="section-title"><h2>Levels</h2><span class="gl-count">${LEVELS.reduce((a, L) => a + L.lessons.length, 0)} lessons in total</span></div>
      <div class="levels">${LEVELS.map(L => {
        const [cls, label] = status(L); const done = lessonsDone(L);
        return `<a class="lvl ${L.n === currentLevel() ? "current" : ""}" href="#level-${L.n}">
          <div class="lvl-top"><span class="eyebrow">Level ${L.n}${L.main ? " · main focus" : ""}</span><span class="chip ${cls}">${label}</span></div>
          <h3>${esc(L.title)}</h3>
          <p>${esc(L.intro.split(". ")[0].replace(/\.$/, ""))}.</p>
          <div class="bar"><i style="width:${Math.round(levelPct(L) * 100)}%"></i></div>
          <div class="meta"><span class="mono">${done}/${L.lessons.length} lessons · ${goalsDone(L)}/${L.goals.length} goals</span><span>${L.weeks}</span></div>
        </a>`; }).join("")}
      </div>
    </div>
    <div>
      <div class="section-title"><h2>Rules for the whole journey</h2></div>
      <div class="rules">
        <div class="rule"><b>Only spare money</b><p>Never trade with borrowed money, savings you need, or emergency funds.</p></div>
        <div class="rule"><b>Paper first</b><p>Every strategy is paper traded before it touches real money. Real money starts at ₹10,000 to ₹25,000, CNC only.</p></div>
        <div class="rule"><b>Journal everything</b><p>Log every trade from Level 1. If you hit your monthly loss limit, go back to paper trading.</p></div>
      </div>
    </div>
  </section>`;
}

function renderLevel(n) {
  const L = levelOf(n);
  const [cls, label] = status(L);
  const unlocked = levelUnlocked(n);
  const nx = nextLesson();
  const prev = n > 1 ? levelOf(n - 1) : null, next = n < 6 ? levelOf(n + 1) : null;
  let notes = "";
  if (!unlocked) notes += `<div class="note">Tick off all Level ${n - 1} goals to unlock this level. You can read the outline now.${L.earlyLessons && levelUnlocked(4) ? ` Lessons 1 to ${L.earlyLessons} are already open, because you size positions from your first Level 4 paper trade.` : ""}</div>`;
  else if (L.earlyLessons) notes += `<div class="note">Lessons 1 to ${L.earlyLessons} also open alongside Level 4, because you size positions from your first paper trade.</div>`;
  if (L.learnOnly) notes += `<div class="note warn"><b>Learn-only.</b> Lessons 1 to ${L.learnOnly} cover futures and options so you understand them. You will never trade F&amp;O. SEBI's 2024 study found about 9 in 10 individual F&amp;O traders lost money over three years.</div>`;

  const lessonRows = L.lessons.map((t, i) => {
    const id = L.ids[i], done = !!state.lessons[id], open = lessonUnlocked(L, i);
    const isNext = nx && nx.L.n === n && nx.i === i;
    const url = LESSON_URLS[id];
    const link = url ? `<a class="lopen" href="${esc(url)}" target="_blank" rel="noopener">Open lesson ↗</a>` : `<span class="lopen soon">Coming soon</span>`;
    return `<li class="${done ? "is-done" : ""} ${isNext ? "is-next" : ""}">
      <input class="tick" type="checkbox" id="ls-${id}" data-lesson="${id}" ${done ? "checked" : ""} ${open ? "" : "disabled"} aria-label="Mark lesson ${id} done">
      <span class="lnum">${id}</span>
      <label class="ltitle" for="ls-${id}">${esc(t)}${L.learnOnly && i < L.learnOnly ? ` <span class="chip learn">learn-only</span>` : ""}</label>
      ${link}
    </li>`;
  }).join("");

  const goalRows = L.goals.map((g, i) => {
    const id = goalId(n, i), done = !!state.goals[id];
    return `<li><label><input class="tick" type="checkbox" id="gl-${id}" data-goal="${id}" ${done ? "checked" : ""} ${unlocked ? "" : "disabled"}><span>${esc(g)}</span></label></li>`;
  }).join("");

  app.innerHTML = `
  <section class="view">
    <div class="lvl-hero">
      <div class="crumbs"><a href="#map">Level map</a><span>/</span><span>Level ${n}</span></div>
      <div class="row"><span class="eyebrow">Level ${n} of 6 · ${L.lessons.length} lessons · ${L.weeks}${L.main ? " · main focus" : ""}</span><span class="chip ${cls}">${label}</span></div>
      <h1>${esc(L.title)}</h1>
      <p>${esc(L.intro)}</p>
      <div class="bar" style="max-width:420px"><i style="width:${Math.round(levelPct(L) * 100)}%"></i></div>
      ${notes}
    </div>
    <div class="cols">
      <div class="panel">
        <h2>Lessons</h2>
        <ol class="lessons">${lessonRows}</ol>
      </div>
      <div class="panel">
        <div class="box"><h3>Goals before moving on</h3><ul class="goals">${goalRows}</ul></div>
        <div class="box"><h3>Practice tasks</h3><ul class="plain">${L.practice.map(p => `<li>${esc(p)}</li>`).join("")}</ul></div>
        <div class="box"><h3>Real data used</h3><p>${esc(L.data)}</p></div>
        <div class="box"><h3>Key terms</h3><div class="terms">${L.terms.map(t => `<a href="#glossary" data-term="${esc(t)}">${esc(t)}</a>`).join("")}</div></div>
      </div>
    </div>
    <div class="pager">
      ${prev ? `<a href="#level-${prev.n}">← Level ${prev.n}: ${esc(prev.title)}</a>` : `<span></span>`}
      ${next ? `<a href="#level-${next.n}">Level ${next.n}: ${esc(next.title)} →</a>` : `<a href="#map">Back to the level map</a>`}
    </div>
  </section>`;
}

function renderGlossary() {
  const names = Object.keys(GLOSSARY).sort((a, b) => a.localeCompare(b, "en", { sensitivity: "base" }));
  app.innerHTML = `
  <section class="view">
    <div class="hello">
      <span class="eyebrow">${names.length} terms</span>
      <h1>Glossary</h1>
      <p>Every key term in the course, in plain English. Each one is tagged with the level where you first meet it.</p>
    </div>
    <div class="gl-tools">
      <input class="search" id="glSearch" type="search" placeholder="Search a term, like VWAP or stop-loss" value="${esc(glQuery)}" aria-label="Search the glossary">
      <div class="filters" role="group" aria-label="Filter by level">
        <button type="button" data-f="0" aria-pressed="${glFilter === 0}">All</button>
        ${LEVELS.map(L => `<button type="button" data-f="${L.n}" aria-pressed="${glFilter === L.n}">L${L.n} ${esc(L.short)}</button>`).join("")}
      </div>
      <span class="gl-count" id="glCount"></span>
    </div>
    <dl class="gloss" id="glList"></dl>
  </section>`;
  drawGlossaryList(names);
  const s = document.getElementById("glSearch");
  s.addEventListener("input", () => { glQuery = s.value; drawGlossaryList(names); });
  app.querySelectorAll("[data-f]").forEach(b => b.addEventListener("click", () => {
    glFilter = +b.dataset.f;
    app.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.f === glFilter)));
    drawGlossaryList(names);
  }));
}
function drawGlossaryList(names) {
  const q = glQuery.trim().toLowerCase();
  const shown = names.filter(n => (!glFilter || GLOSSARY[n][0] === glFilter) && (!q || n.toLowerCase().includes(q) || GLOSSARY[n][1].toLowerCase().includes(q)));
  document.getElementById("glCount").textContent = `Showing ${shown.length} of ${names.length}`;
  document.getElementById("glList").innerHTML = shown.length
    ? shown.map(n => `<div class="term" id="${slug(n)}"><dt>${esc(n)} <small>L${GLOSSARY[n][0]}</small></dt><dd>${esc(GLOSSARY[n][1])}</dd></div>`).join("")
    : `<p class="empty">No term matches "${esc(glQuery)}". Try a shorter word.</p>`;
}

function route() {
  const h = (location.hash || "#map").slice(1);
  const m = /^level-([1-6])$/.exec(h);
  let tab = "map";
  if (m) { renderLevel(+m[1]); tab = "level"; }
  else if (h === "glossary") { renderGlossary(); tab = "glossary"; }
  else renderMap();
  document.querySelectorAll("nav.tabs a").forEach(a => {
    if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    if (a.dataset.tab === "level") a.href = "#level-" + (m ? m[1] : currentLevel());
  });
  if (pendingTerm && tab === "glossary") {
    const el = document.getElementById(slug(pendingTerm));
    if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); }
    pendingTerm = null;
  } else window.scrollTo(0, 0);
}
function render() { const y = window.scrollY; route(); if (!pendingTerm) window.scrollTo(0, y); }

app.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.lesson) { if (t.checked) state.lessons[t.dataset.lesson] = Date.now(); else delete state.lessons[t.dataset.lesson]; }
  else if (t.dataset.goal) { if (t.checked) state.goals[t.dataset.goal] = Date.now(); else delete state.goals[t.dataset.goal]; }
  else return;
  persist(); render();
});
app.addEventListener("click", e => {
  const a = e.target.closest("[data-term]");
  if (a) { pendingTerm = a.dataset.term; glFilter = 0; glQuery = ""; }
});
window.addEventListener("hashchange", route);

let resetArmed = false;
document.getElementById("resetBtn").addEventListener("click", e => {
  if (!resetArmed) { resetArmed = true; e.target.textContent = "Click again to erase all progress"; setTimeout(() => { resetArmed = false; e.target.textContent = "Reset progress"; }, 4000); return; }
  resetArmed = false; e.target.textContent = "Reset progress";
  state = { lessons: {}, goals: {}, updatedAt: 0 }; persist(); render();
});

route();
initStore();
</script>

</body>
</html>
